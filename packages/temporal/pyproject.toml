[project]
name = "wdf-temporal"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["opentelemetry-api", "opentelemetry-sdk", "pyyaml", "temporalio", "wdf-events", "wdf-itest", "wdf-keys"]

[tool.uv.sources]
wdf-events = { workspace = true }
wdf-itest = { workspace = true }
wdf-keys = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
