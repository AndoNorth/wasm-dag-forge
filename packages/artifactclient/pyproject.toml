[project]
name = "wdf-artifactclient"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic", "pytest", "pyyaml", "wdf-compat", "wdf-events"]

[project.entry-points.pytest11]
wdf_artifactclient = "wdf_artifactclient.testing"

[tool.uv.sources]
wdf-compat = { workspace = true }
wdf-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
