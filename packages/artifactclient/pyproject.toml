[project]
name = "wdf-artifactclient"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3",
    "pydantic",
    "pytest",
    "pyyaml",
    "wdf-compat",
    "wdf-events",
    "wdf-storecheck",
]

[project.entry-points.pytest11]
wdf_artifactclient = "wdf_artifactclient.testing"

[tool.uv.sources]
wdf-compat = { workspace = true }
wdf-events = { workspace = true }
wdf-storecheck = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
