[project]
name = "wdf-stateops"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]", "wdf-jobstate", "wdf-keys"]

[project.entry-points."wdf.migrations"]
stateops = "wdf_stateops.migrations"

[tool.uv.sources]
wdf-jobstate = { workspace = true }
wdf-keys = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
