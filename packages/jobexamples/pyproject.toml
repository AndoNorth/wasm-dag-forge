[project]
name = "wdf-jobexamples"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["wdf-jobdoc", "wdf-jobcheck", "wdf-plan"]

[tool.uv.sources]
wdf-jobdoc = { workspace = true }
