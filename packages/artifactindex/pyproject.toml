[project]
name = "wdf-artifactindex"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]", "pydantic", "pyyaml", "wdf-events"]

[project.entry-points."wdf.migrations"]
artifactindex = "wdf_artifactindex.migrations"

[tool.uv.sources]
wdf-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
