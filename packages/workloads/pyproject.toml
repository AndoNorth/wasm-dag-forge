[project]
name = "wdf-workloads"
version = "0.0.0"
requires-python = ">=3.13"
# Runs inside a guest too, so the only dependency is the standard library kernel.
dependencies = ["wdf-kernel"]

[tool.uv.sources]
wdf-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
