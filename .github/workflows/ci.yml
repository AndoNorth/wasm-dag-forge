name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Setting the repository variable CI_ENABLED to false skips this job; a commit message containing [skip ci] also skips runs natively.
  check:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop -c just ci
