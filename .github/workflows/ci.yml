name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Setting the repository variable CI_ENABLED to false skips this job.
  # A commit message containing [skip ci] also skips runs natively.
  check:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop -c just ci
      - name: Reproducibility check
        run: |
          drv() {
            mkdir "$1" && git archive HEAD | tar -x -C "$1"
            (cd "$1" && nix eval --raw .#devShells.x86_64-linux.default.drvPath)
          }
          a=$(drv "$RUNNER_TEMP/export-a")
          b=$(drv "$RUNNER_TEMP/export-b")
          echo "$a"
          [ "$a" = "$b" ] || { echo "drvPath differs: $b" >&2; exit 1; }
