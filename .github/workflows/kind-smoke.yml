name: kind-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Setting the repository variable CI_ENABLED to false skips every job.
  # A commit message containing [skip ci] also skips runs natively.
  # A pull request that changes documentation only skips the cluster run, a push to main always runs it.
  # The job is skipped rather than the workflow filtered, so a check made required later always reports.
  changes:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        # The pull request checkout is a merge commit whose first parent is the base branch.
        run: |
          mode=full
          [ "$EVENT" != pull_request ] || mode=$(git diff --name-only --no-renames HEAD^1 HEAD | scripts/ci-paths.sh)
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"

  kind-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WDF_PRESET: ci
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Runner size
        run: |
          nproc
          grep -E '^(MemTotal|MemAvailable):' /proc/meminfo
          free -m
      - run: nix develop -c just up
      - name: Export cluster logs
        if: ${{ failure() }}
        run: nix develop -c kind export logs --name wdf "$RUNNER_TEMP/cluster-logs"
      - name: Upload cluster logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs
          path: ${{ runner.temp }}/cluster-logs
          if-no-files-found: ignore
      - run: nix develop -c just down
