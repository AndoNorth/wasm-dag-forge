name: appdb
group: infra
namespace: wdf-infra
artifact:
  kind: image
  pin: timescale/timescaledb
resources:
  appdb:
    requests:
      cpu: 250m
      memory: 832Mi
    limits:
      cpu: "1"
      memory: 832Mi
readiness:
  resource: statefulset/appdb
  condition: Ready
profiles: [dev, full, ci]
