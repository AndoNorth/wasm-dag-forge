# A GitHub runner, with a total about 10.6 GiB.
# Node sizes are hard container limits, and a node never exceeds its size.
# Figures follow docs/spikes/S2-footprint.md: a pool node fits one pod slot of deploy/presets/slots plus the daemons of
# the node, and the infra node fits its quota. Worker pool sizes are provisional estimates until real components are
# characterized, and the control plane size is a computed figure, not a measured one.
name: ci
fitted: true
memory_mib: 10880
cpus: 7
nodes:
  - role: control-plane
    count: 1
    cpus: 1
    memory_mib: 1280
  - role: infra
    count: 1
    cpus: 2
    memory_mib: 5120
  - role: obs
    count: 1
    cpus: 0.5
    memory_mib: 640
  - role: compile
    count: 1
    cpus: 1.5
    memory_mib: 1536
  - role: simulate
    count: 1
    cpus: 0.5
    memory_mib: 768
  - role: aggregate
    count: 1
    cpus: 1.5
    memory_mib: 1536
host:
  ports: deploy/host/ports.yaml
  data_dir: ~/.local/share/wdf/ci
mirror: true
