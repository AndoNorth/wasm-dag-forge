# One task per pod on the compile and aggregate pools, so requests equal limits and one pod fills one slot.
# The figures are a provisional estimate until real components are characterized.
estimate: true
pools:
  compile:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "1", memory: 1Gi}
  aggregate:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "1", memory: 1Gi}
