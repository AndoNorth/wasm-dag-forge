# The developer WSL VM with 20 GiB, total about 15 GiB, so the VM keeps room for Docker and the shell.
# Node sizes are hard container limits, and a node never exceeds its size.
# Figures follow docs/spikes/S2-footprint.md: a pool node fits one pod slot of deploy/presets/slots plus the daemons of
# the node, and the infra node fits its quota. Worker pool sizes are provisional estimates until real components are
# characterized, and the control plane size is a computed figure, not a measured one.
name: soak
fitted: true
memory_mib: 15104
cpus: 20
nodes:
  - role: control-plane
    count: 1
    cpus: 2
    memory_mib: 1280
  - role: infra
    count: 1
    cpus: 6
    memory_mib: 6144
  - role: obs
    count: 1
    cpus: 2
    memory_mib: 1536
  - role: compile
    count: 2
    cpus: 2
    memory_mib: 1536
  - role: simulate
    count: 2
    cpus: 2
    memory_mib: 768
  - role: aggregate
    count: 1
    cpus: 2
    memory_mib: 1536
host:
  ports: deploy/host/ports.yaml
  data_dir: ~/.local/share/wdf/soak
mirror: false
