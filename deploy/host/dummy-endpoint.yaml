# Stand-in for the dispatch and control endpoint: one replica in wdf-control answering HTTP on the control-api NodePort.
# It serves a static file with busybox httpd, so the host access map can be proved before a real module exists.
apiVersion: v1
kind: Namespace
metadata:
  name: wdf-control
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-endpoint
  namespace: wdf-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-endpoint
  template:
    metadata:
      labels:
        app: dummy-endpoint
    spec:
      nodeSelector:
        wdf.dev/pool: infra
      tolerations:
        - key: wdf.dev/pool
          operator: Exists
      containers:
        - name: httpd
          image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: ["sh", "-c", "echo wdf-dummy-endpoint > /tmp/index.html && exec httpd -f -p 8080 -h /tmp"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-endpoint
  namespace: wdf-control
spec:
  type: NodePort
  selector:
    app: dummy-endpoint
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
