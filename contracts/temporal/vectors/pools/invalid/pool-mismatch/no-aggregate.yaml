# Pool table v0: the ci slot of each pool and its timeouts. Schema: pools.schema.json.
# Every value is an estimate, until a contract change replaces this file with real values and formulas.
# The slots equal deploy/presets/slots/ci.yaml. A task's start-to-close timeout is its run timeout plus the margin.
# A schedule-to-start timeout doubles at each re-schedule up to the ceiling.
estimate: true
schedule_to_start_ceiling_s: 43200
pools:
  compile:
    cpu_milli: 1000
    memory_mib: 1024
    schedule_to_start_s: 1800
    heartbeat_s: 60
    start_to_close_margin_s: 120
  simulate:
    cpu_milli: 250
    memory_mib: 384
    schedule_to_start_s: 1800
    heartbeat_s: 60
    start_to_close_margin_s: 120
