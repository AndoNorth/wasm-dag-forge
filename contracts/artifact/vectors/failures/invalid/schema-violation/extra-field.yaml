# A field that the table does not have.
codes:
  - code: STORE_UNAVAILABLE
    cause: The store is unreachable or answers with a fault that is not a missing object, a hash mismatch or a refused
      credential, including during the verification of a checkpoint.
    retry: backoff-within-deadline
    attempt_class: retryable
    surface:
      exception: StoreUnavailable
      event_reason: 'STORE_UNAVAILABLE: '
    extra: 1
