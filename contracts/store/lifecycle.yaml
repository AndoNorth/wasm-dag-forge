---
# Lifecycle rules per bucket. Schema: store.schema.json, generated from the models.
# A window names a key of contracts/state/retention.yaml, so the number lives in one place.
# Sources and components have no age rule, because their keys are content-addressed and shared across jobs.
detection_interval_minutes: 60
buckets:
  wdf-sources:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wdf-sources.abort_incomplete_multipart_after_days}
  wdf-components:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wdf-components.abort_incomplete_multipart_after_days}
  wdf-results:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wdf-results.abort_incomplete_multipart_after_days}
      - {kind: expire, window: windows.wdf-results.expire_after_days}
  wdf-checkpoints:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wdf-checkpoints.abort_incomplete_multipart_after_days}
      - {kind: expire, window: windows.wdf-checkpoints.expire_after_days}
