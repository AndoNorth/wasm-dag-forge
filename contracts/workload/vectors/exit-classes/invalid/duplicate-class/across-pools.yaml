pools:
  simulate:
    classes:
      - {class: ok, trigger: wasmtime exits 0., deterministic: true}
  compile:
    classes:
      - {class: compile_failed, trigger: refused., deterministic: true, exit_code: 3}
  aggregate:
    classes:
      - {class: compile_failed, trigger: a bug., deterministic: false, exit_code: 1}
